name: Deploy Pfitztronic website

on:
  push:
    branches:
      - main

jobs:
  test-and-build:
    name: Deploy Pfitztronic website
    runs-on: ubuntu-latest
    env:
      AWS_ACCESS_KEY_ID: ${{secrets.AWS_ACCESS_KEY_ID}}
      AWS_SECRET_ACCESS_KEY: ${{secrets.AWS_SECRET_ACCESS_KEY}}
      AWS_DEFAULT_REGION: af-south-1

    steps:
      - name: Checkout code
        uses: actions/Checkout@v3

      - name: Sync files to S3
        run: aws s3 sync . s3://pfitz.co.zw/ --delete --region af-south-1

      - name: Invalidate distribution
        run: aws cloudfront create-invalidation --distribution-id E3FWCQUIOE0U9D --paths "/*"